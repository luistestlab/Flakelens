name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --junitxml=test-results.xml

      # Dogfooding: analyze our own test results with flakelens.
      - name: Analyze own test results
        if: always()
        run: |
          flakelens import test-results.xml --commit "${{ github.sha }}" --branch "${{ github.ref_name }}"
          flakelens report --status all --limit 10
