[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flakelens"
version = "0.1.0"
description = "Find flaky tests by analyzing the history of your JUnit XML test reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Luis" }]
keywords = ["testing", "flaky-tests", "junit", "qa", "ci"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flakelens = "flakelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
